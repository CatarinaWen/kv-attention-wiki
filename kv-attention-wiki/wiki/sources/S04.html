<h1>S04 Wedel &amp; Pieters (2000)：注視與品牌記憶</h1>
<p>原始筆記：<a href="../../raw/S04-wedel-pieters-2000.html">raw/S04</a></p>
<h2>這篇在說什麼</h2>
<ul>
<li>廣告被看到是必要條件，但還不夠，品牌要被記住才算有效<a class="tag" href="../../wiki/sources/S04.html">S04</a></li>
<li>記錄受試者翻雜誌時在品牌、圖像、文字 3 個元素上的注視次數，再測品牌記憶<a class="tag" href="../../wiki/sources/S04.html">S04</a></li>
<li>品牌上的注視（其次是圖像）讓品牌記憶更準、更快<a class="tag" href="../../wiki/sources/S04.html">S04</a></li>
<li>模型假設重要的是注視次數，而不是每次看多久<a class="tag" href="../../wiki/sources/S04.html">S04</a></li>
</ul>
<h2>對 KV 有什麼用</h2>
<ul>
<li>前測 KV 不能只看「有沒有被看」，要看「品牌有沒有被看到」<a class="tag" href="../../wiki/sources/S04.html">S04</a></li>
</ul>
